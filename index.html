<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GATEWORK · 헌터 채용 플랫폼</title>
<style>
:root{
  --bg:#101215; --bg2:#14171b; --panel:#1a1e23; --panel2:#222730; --line:#2c323a; --line2:#3b424c;
  --text:#edf0f2; --sub:#a3adb8; --mute:#707b87;
  --mint:#35f2c2; --mint-d:#14b88e; --mint-bg:rgba(53,242,194,.09);
  --gold:#ead6a6; --gold-d:#c9a45c; --gold-bg:rgba(234,214,166,.09);
  --warn:#ffb347; --warn-bg:rgba(255,179,71,.1); --danger:#ff6b6b; --danger-bg:rgba(255,107,107,.1); --blue:#8fb4ff;
  --font:"Pretendard Variable","Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--mint);color:#04120e;padding:8px 12px;z-index:100;border-radius:4px}
.skip:focus{left:8px}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
.ic{flex:none;vertical-align:middle}
.sub{color:var(--sub)} .mute{color:var(--mute)} .sm{font-size:12px}

/* header */
#gh{position:sticky;top:0;z-index:50;background:rgba(16,18,21,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#gh .wrap{display:flex;align-items:center;height:60px;gap:36px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.06em}
.logo b{color:var(--mint);font-weight:800}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav a{position:relative;padding:20px 12px;font-size:14px;color:var(--sub);white-space:nowrap}
.nav a:hover{color:var(--text)}
.nav a.on{color:var(--text);font-weight:600}
.nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--mint);border-radius:3px 3px 0 0}
.hr{display:flex;align-items:center;gap:6px}
.ib{position:relative;width:38px;height:38px;display:grid;place-items:center;background:none;border:0;border-radius:8px;color:var(--sub)}
.ib:hover{background:var(--panel);color:var(--text)}
.ib .dot{position:absolute;top:7px;right:7px;min-width:8px;height:8px;border-radius:8px;background:var(--mint)}
.ib .cnt{position:absolute;top:3px;right:1px;background:var(--mint);color:#04120e;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:15px}
.me{display:flex;align-items:center;gap:9px;margin-left:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:30px;background:var(--panel);cursor:pointer}
.me i{width:28px;height:28px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:var(--mint)}
.me span{font-size:12.5px;line-height:1.2} .me small{display:block;color:var(--mute);font-size:11px}

/* ticker */
#ticker{background:var(--bg2);border-bottom:1px solid var(--line)}
#ticker .wrap{display:flex;align-items:center;gap:16px;height:42px;font-size:12.5px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.tk-l{color:var(--sub);display:flex;gap:8px;align-items:center}
.tk{display:flex;gap:7px;align-items:baseline}
.tk b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:var(--panel2);font-size:11px}
.tk em{font-style:normal;font-size:11px}
.up{color:var(--mint)} .dn{color:var(--danger)}
.tk-sep{width:1px;height:18px;background:var(--line);flex:none}
.tk-r{margin-left:auto;display:flex;gap:14px;align-items:center}
.live{display:inline-flex;gap:6px;align-items:center}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint)}
.live.warn::before{background:var(--warn)}

/* generic */
.crumb{display:flex;gap:8px;align-items:center;padding:16px 0 10px;color:var(--mute);font-size:12.5px}
.crumb a:hover{color:var(--text)} .crumb .cur{color:var(--sub)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 308px;gap:24px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.sec>h2,.hd{font-size:16.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec>h2 small,.hd small{font-weight:400;color:var(--mute);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:600;background:var(--panel2);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.badge.mint{background:var(--mint-bg);color:var(--mint);border-color:rgba(53,242,194,.28)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(255,179,71,.3)}
.badge.red{background:var(--danger-bg);color:var(--danger);border-color:rgba(255,107,107,.3)}
.badge.gold{background:var(--gold-bg);color:var(--gold);border-color:rgba(234,214,166,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--mint);border-color:var(--mint);color:#04120e}
.btn.pri:hover{background:#6bf7d5}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241b08}
.btn.gold:hover{background:#f3e3bb}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.chip{height:32px;padding:0 13px;border-radius:30px;border:1px solid var(--line2);background:transparent;color:var(--sub);font-size:13px}
.chip:hover{color:var(--text);border-color:var(--sub)}
.chip[aria-pressed=true]{background:var(--mint-bg);border-color:var(--mint);color:var(--mint)}
input,select{height:42px;background:var(--bg);border:1px solid var(--line2);border-radius:7px;color:var(--text);font:inherit;padding:0 12px;min-width:0}
input::placeholder{color:var(--mute)}
select{padding-right:6px}
label.f{display:grid;gap:5px;font-size:12px;color:var(--sub)}

/* hero (home) */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:20px;padding:22px 0 8px}
.hero-main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 30px}
.hero-main h1{font-size:28px;line-height:1.3;font-weight:800;letter-spacing:-.01em}
.hero-main>p{margin-top:8px;color:var(--sub)}
.sform{display:grid;grid-template-columns:minmax(0,1.5fr) 130px 130px 104px;gap:10px;margin-top:20px}
.sform .go{grid-column:auto}
.matcher{margin-top:14px;display:flex;gap:14px;align-items:center;border:1px dashed var(--line2);border-radius:9px;padding:12px 14px;background:var(--bg)}
.matcher label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.matcher input{width:78px;height:36px;text-align:center;font-weight:700;color:var(--mint)}
#mres{font-size:13px;line-height:1.5}
#mres b{color:var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.banner h2{font-size:18px;line-height:1.4}
.phase{display:grid;grid-template-columns:6fr 18fr 6fr;gap:4px;margin-top:4px}
.phase div{height:8px;background:var(--panel2);border-radius:2px;position:relative}
.phase div.cur{background:var(--mint)}
.phase div.done{background:var(--mint-d);opacity:.55}
.phase-l{display:grid;grid-template-columns:6fr 18fr 6fr;gap:4px;font-size:11.5px;color:var(--mute)}
.phase-l span.cur{color:var(--mint);font-weight:600}

/* job cards */
.jobs{display:grid;gap:12px}
[data-tab=home] .jobs.v2{grid-template-columns:1fr 1fr}
[data-tab=home] .jobs.v2 .job:last-child{grid-column:1/-1}
.job{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px 16px 20px}
.job:hover{border-color:var(--line2)}
.job.sus{border-color:rgba(255,179,71,.45);background:linear-gradient(180deg,var(--warn-bg),var(--panel) 60%)}
.job-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.job-top .org{font-weight:700;color:var(--text);font-size:13.5px}
.job h3{font-size:17px;margin:8px 0 5px;font-weight:700;padding-right:44px}
.job p.d{color:var(--sub);font-size:13.5px}
.job-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;font-size:12.5px;color:var(--sub)}
.job-meta b{color:var(--text);font-weight:600}
.job-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.job-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.scrap{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--mute)}
.scrap[aria-pressed=true]{color:var(--mint);border-color:var(--mint)}
.scrap[aria-pressed=true] svg{fill:var(--mint)}
.job .more{display:none;margin-top:12px;font-size:13px;color:var(--sub);background:var(--bg);border-radius:8px;padding:12px 14px}
.job .more.open{display:block}
.job .more li{margin:3px 0}
.job .more ul{margin:0;padding-left:18px}
.warnline{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:12.5px;color:var(--warn)}
.empty{padding:36px;text-align:center;color:var(--sub);border:1px dashed var(--line2);border-radius:10px}
.listhd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.listhd h2{font-size:18px}

/* side widgets */
.side{display:grid;gap:16px;position:sticky;top:76px}
.w{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.w h3{font-size:14.5px;display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.w h3 small{font-weight:400;color:var(--mute);font-size:11.5px}
.w ul{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.wi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px}
.wi small{display:block;color:var(--mute);font-size:11.5px}
.gr{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 5px;border-radius:5px;background:var(--panel2);font-weight:700;font-size:12px}
.gr.E{color:#9bd1ff}.gr.D{color:#7ee0a8}.gr.C{color:#f1e27a}.gr.B{color:#ffb86b}.gr.A{color:#ff8e8e}.gr.S{color:#e9a6ff}
.gbars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:118px}
.gbars div{display:grid;gap:4px;justify-items:center;font-size:11px;color:var(--sub)}
.gbars i{display:block;width:100%;background:var(--panel2);border-radius:3px 3px 0 0;position:relative}
.gbars i.v{background:var(--mint-d)}
.rk{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:7px}
.rk.me2{background:var(--gold-bg);outline:1px solid rgba(234,214,166,.25)}
.rk b{color:var(--mute);font-weight:600;text-align:center}
.rk.me2 b{color:var(--gold)}
.bty{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--bg);font-size:12.5px}
.bty b{font-size:13.5px}

/* community */
.posts{display:grid;gap:0}
.post{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.post:last-child{border:0}
.post small{color:var(--mute);font-size:12px;white-space:nowrap}
.notice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--panel);font-size:13px;color:var(--sub)}
.notice b{color:var(--text)}

/* footer */
#gf{margin-top:56px;border-top:1px solid var(--line);background:var(--bg2);padding:34px 0 46px;font-size:12.5px;color:var(--sub)}
.fg{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:28px}
.fg h4{color:var(--text);font-size:13px;margin-bottom:10px}
.fg a{display:block;margin:6px 0}
.fg a:hover{color:var(--text)}
.cert{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;margin-top:12px;color:var(--text)}
.fine{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}

/* ===== guild page ===== */
.rtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:4px}
.rtabs button{background:none;border:0;padding:10px 14px;color:var(--sub);font-size:13.5px;position:relative}
.rtabs button[aria-selected=true]{color:var(--text);font-weight:600}
.rtabs button[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--mint)}
.rstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 18px}
.rc{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13px}
.rc b{grid-row:span 2;font-size:20px;color:var(--mute);align-self:center;text-align:center}
.rc em{font-style:normal;color:var(--sub);font-size:12px}
.rc.me2{border-color:rgba(234,214,166,.5);background:linear-gradient(90deg,var(--gold-bg),var(--panel))}
.rc.me2 b{color:var(--gold)}
.rnote{font-size:12px;color:var(--mute);margin:-8px 0 14px}

.brand{position:relative;overflow:hidden;border:1px solid rgba(234,214,166,.28);border-radius:14px;background:
  radial-gradient(520px 260px at 6% 30%,rgba(234,214,166,.16),transparent 70%),
  linear-gradient(110deg,#1d1c18 0%,#16181c 46%,#16191d 100%);
  display:grid;grid-template-columns:minmax(0,1fr) 380px}
.brand-l{padding:32px 34px 26px}
.brand-r{padding:26px 28px;border-left:1px solid rgba(234,214,166,.18);background:rgba(10,11,13,.35);display:flex;flex-direction:column;gap:14px}
.rankbadge{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(234,214,166,.5);border-radius:6px;padding:5px 12px 5px 5px;color:var(--gold);font-size:12.5px;font-weight:600;background:rgba(234,214,166,.07)}
.rankbadge b{display:grid;place-items:center;background:var(--gold);color:#241b08;border-radius:4px;min-width:34px;height:26px;font-size:14px}
.mark{display:flex;align-items:center;gap:20px;margin:20px 0 6px}
.wm{font-size:46px;font-weight:800;letter-spacing:.14em;color:var(--gold);line-height:1;
  text-shadow:-8px 0 0 rgba(234,214,166,.34),-16px 0 0 rgba(234,214,166,.18),-24px 0 0 rgba(234,214,166,.08)}
.wm-ko{font-size:18px;color:var(--sub);margin-left:30px;font-weight:600;letter-spacing:.04em}
.bchips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.slogan{font-size:19px;font-weight:700;margin-top:6px}
.bdesc{color:var(--sub);margin-top:6px;max-width:62ch}
.bmeta{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:18px;align-items:center;font-size:13px;color:var(--sub)}
.bmeta b{color:var(--text);font-size:15px}
.bact{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.lead{display:grid;grid-template-columns:132px 1fr;gap:16px}
.ph{width:132px;height:168px;border-radius:10px;overflow:hidden;border:1px solid rgba(234,214,166,.35);background:#12141a}
.lead h3{font-size:22px;font-weight:800;margin:2px 0 2px}
.lead dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.lead dt{color:var(--mute)} .lead dd{margin:0}
.quote{font-size:13.5px;border-left:2px solid var(--gold-d);padding:4px 0 4px 12px;color:var(--text)}
.deputy{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sub);padding-top:12px;border-top:1px solid rgba(234,214,166,.15)}
.deputy i{width:30px;height:30px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--sub)}

.gtabs{display:flex;gap:2px;margin:18px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.gtabs button{background:none;border:0;padding:13px 16px;color:var(--sub);font-size:14.5px;white-space:nowrap;position:relative}
.gtabs button:hover{color:var(--text)}
.gtabs button[aria-selected=true]{color:var(--text);font-weight:700}
.gtabs button[aria-selected=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--mint);border-radius:3px 3px 0 0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border:1px solid var(--line);border-radius:9px;padding:15px 16px;background:var(--bg2);position:relative}
.stat .v{font-size:27px;font-weight:800;line-height:1.15}
.stat .v small{font-size:14px;font-weight:600;color:var(--sub);margin-left:2px}
.stat .l{font-size:13px;color:var(--sub);margin-top:3px}
.stat .n{font-size:11.5px;color:var(--mute);margin-top:6px}
.info{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;border:0;background:none;color:var(--mute);display:grid;place-items:center;padding:0}
.info:hover,.info:focus-visible{color:var(--text)}
.info::after{content:attr(data-tip);position:absolute;right:0;top:26px;width:230px;background:#2a3038;border:1px solid var(--line2);border-radius:7px;padding:9px 11px;font-size:12px;line-height:1.5;color:var(--text);text-align:left;opacity:0;pointer-events:none;z-index:5;transform:translateY(-3px);transition:.14s}
.info:hover::after,.info:focus-visible::after{opacity:1;transform:none}
.fn{margin-top:12px;font-size:12px;color:var(--mute);line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bars{display:grid;gap:11px}
.bar{display:grid;grid-template-columns:104px 1fr 56px;gap:12px;align-items:center;font-size:13px}
.bar .t{height:12px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:3px;background:var(--mint-d)}
.bar span.n{text-align:right;font-weight:700}
.bar small{display:block;color:var(--mute);font-size:11px}
.hatch{background:repeating-linear-gradient(135deg,var(--line2) 0 5px,var(--panel2) 5px 10px)!important}
.svgchart{width:100%;height:auto;display:block}
.svgchart text{fill:var(--sub);font-size:11px;font-family:var(--font)}

.org{display:grid;gap:0;justify-items:center;margin:6px 0 18px}
.org-top{display:flex;gap:46px;position:relative}
.org-top::before{content:"";position:absolute;left:25%;right:25%;top:50%;border-top:1px dashed var(--line2)}
.nd{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 14px;text-align:center;font-size:12.5px;position:relative;min-width:150px}
.nd b{display:block;font-size:14px}
.nd.head{border-color:rgba(234,214,166,.55);background:var(--gold-bg)}
.org-stem{width:1px;height:20px;background:var(--line2)}
.org-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;width:100%;position:relative;padding-top:18px}
.org-row::before{content:"";position:absolute;left:6.25%;right:6.25%;top:0;border-top:1px solid var(--line2)}
.org-row .nd{min-width:0;padding:9px 6px}
.org-row .nd::before{content:"";position:absolute;left:50%;top:-18px;height:18px;border-left:1px solid var(--line2)}
.org-row .nd b{font-size:12.5px;line-height:1.3}
.org-row .nd span{color:var(--mint);font-weight:700;font-size:15px;display:block;margin-top:3px}
.org-row .nd small{color:var(--mute);display:block;font-size:11px;line-height:1.35;margin-top:2px}

}

function match(j){
  const q=state.q.trim().toLowerCase();
  if(q&&!(j.org+j.title+j.d+j.region).toLowerCase().includes(q))return false;
  if(state.series&&!j.series.includes(state.series))return false;
  if(state.scale&&j.scale!==state.scale)return false;

   <label class="ck"><input type="checkbox" name="a"><span>계약서 사전 열람 안내와 공시 상세를 확인했습니다.</span></label>`}

   if(!isG){const n=+d.get('n');if(!(n>=1&&n<=160)){$('#me').textContent='입소 차수는 1~160 사이로 입력해 주세요.';return}
     const rej=String(d.get('s')).startsWith('복무 거부');if(rej&&!d.get('c')){$('#me').textContent='복무 이수 경력이 없으면 안전 이수증이 필요합니다. 하루 교육으로 발급받을 수 있습니다.';return}}
   closeModal();toast(isG?'문의가 접수되었습니다. 비공개 창구로 안내 메시지를 보내 드립니다.':'지원서가 접수되었습니다. 결과는 알림으로 안내합니다.')});
  const first=$('#mf select,#mf input');first&&first.focus();
}
function closeModal(){$('#mroot').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const soon=e.target.closest('[data-soon]');if(soon){e.preventDefault();toast(`‘${soon.dataset.soon}’ 메뉴는 시안 단계에서 열려 있지 않습니다.`);return}
  const go=e.target.closest('[data-go]');if(go&&go.dataset.go==='jobs'){if(location.hash.startsWith('#/guild')||true){e.preventDefault();if(location.hash!=='#/')location.hash='#/';setTimeout(()=>{const j=$('#jobs');j&&j.scrollIntoView({behavior:'smooth'})},60)}return}
  const a=e.target.closest('[data-act]');if(!a)return;const k=a.dataset.act;
  if(a.tagName==='A'&&k==='soon')e.preventDefault();
  if(k==='close'){if(a.classList.contains('ov')&&e.target!==a)return;closeModal()}
  else if(k==='soon')toast(`‘${a.dataset.m}’ 기능은 시안 단계에서 제공하지 않습니다.`);
  else if(k==='scrap'){const id=a.dataset.id;scraps.has(id)?scraps.delete(id):scraps.add(id);syncScrap();toast(scraps.has(id)?'스크랩했습니다.':'스크랩을 해제했습니다.')}
  else if(k==='scraps')toast(scraps.size?`스크랩한 공고 ${scraps.size}건`:'스크랩한 공고가 없습니다.');
  else if(k==='more'){const m=$('#m-'+a.dataset.id);const o=m.classList.toggle('open');a.setAttribute('aria-expanded',o)}
  else if(k==='apply')openModal('apply',a.dataset.id);
  else if(k==='guide')openModal('guide',a.dataset.id);
  else if(k==='report')toast('공고 신고 센터로 접수되었습니다. 협회 모니터링 대상에 등록됩니다.');
  else if(k==='chip'){const f=a.dataset.k;state.flags.has(f)?state.flags.delete(f):state.flags.add(f);a.setAttribute('aria-pressed',state.flags.has(f));drawJobs()}
  else if(k==='chipOnly'){state.flags=new Set([a.dataset.k]);$$('.chip').forEach(c=>c.setAttribute('aria-pressed',state.flags.has(c.dataset.k)));drawJobs();$('#jobs').scrollIntoView({behavior:'smooth'})}
  else if(k==='search'){drawJobs();$('#jobs').scrollIntoView({behavior:'smooth'})}
  else if(k==='reset'){state.q='';state.series='';state.scale='';state.flags=new Set();$('#q').value='';$('#fs').value='';$('#fc').value='';$$('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));drawJobs()}
  else if(k==='lrank'){rkKey=a.dataset.k;$$('.rtabs button').forEach(b=>b.setAttribute('aria-selected',b===a));$('#gl').innerHTML=listRows()}
  else if(k==='rank'){rkKey=a.dataset.k;$$('.rtabs button').forEach(b=>b.setAttribute('aria-selected',b===a));drawRank()}
  else if(k==='gtab'){location.hash=a.dataset.k==='home'?'#/guild/verglow':'#/guild/verglow/'+a.dataset.k;}
  else if(k==='rtag'){$$('.rvf .chip').forEach(c=>c.setAttribute('aria-pressed',c===a));drawReviews(a.dataset.k)}
  else if(k==='help'){const on=a.getAttribute('aria-pressed')!=='true';a.setAttribute('aria-pressed',on);a.textContent='도움돼요 '+(+a.dataset.n+(on?1:0))}
  else if(k==='follow'){const on=a.dataset.on!=='1';a.dataset.on=on?1:0;a.textContent=on?'팔로우 중':'팔로우';toast(on?'베르글로 소식을 알림으로 받습니다.':'팔로우를 해제했습니다.')}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){state.q=e.target.value;drawJobs()}
  if(e.target.id==='fs'){state.series=e.target.value;drawJobs()}
  if(e.target.id==='fc'){state.scale=e.target.value;drawJobs()}
  if(e.target.id==='nn'){state.N=+e.target.value;drawMatcher()}
});
document.addEventListener('change',e=>{if(e.target.id==='so'){state.sort=e.target.value;drawJobs()}});

/* ---------- router ---------- */
let page='';
function setNav(k){$$('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===k))}
function route(){
  const p=location.hash.replace(/^#\/?/,'').split('/');let next;
  if(p[0]==='guilds'){renderGuildList();setNav('major');next='guilds'}
  else if(p[0]==='guild'){const id=p[1]||'verglow';
    if(id==='verglow'){const t=TABS.some(x=>x[0]===p[2])?p[2]:'home';renderGuild(t)}
    else if(G[id])renderGeneric(id);
    else{location.hash='#/guilds';return}
    setNav('major');next='guild:'+id}
  else{renderHome();setNav('home');next='home'}
  if(next!==page)window.scrollTo(0,0);else if(next==='guild:verglow'){const g=$('.gtabs');g&&window.scrollY>g.offsetTop&&window.scrollTo({top:g.offsetTop-70})}
  page=next;document.title=next.startsWith('guild:')?G[next.slice(6)].en+' · GATEWORK':next==='guilds'?'메이저 길드 랭킹 · GATEWORK':'GATEWORK · 헌터 채용 플랫폼';
}
window.addEventListener('hashchange',route);
drawTicker();drawFooter();route();
</script>
</body>
